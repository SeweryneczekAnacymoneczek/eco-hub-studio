{% extends 'base.html' %}
{% block content %}
    <div class="glass-panel" style="max-width: 900px;">
        <h2 class="gradient-title" style="font-size: 2.5em;">Eco-Hub Studio</h2>
        <p class="subtitle">Zaawansowane narzędzia do modyfikacji tekstu, gradientów i analizy zasobów.</p>

        <div style="display: flex; gap: 20px; justify-content: center; margin-bottom: 25px;">
            <div style="background: rgba(0, 255, 204, 0.1); border: 1px solid #00ffcc; padding: 15px; border-radius: 10px; flex: 1;">
                <h4 style="margin: 0; color: #00ffcc;">Znaków</h4>
                <p id="licznik-znakow" style="font-size: 2em; font-weight: bold; margin: 5px 0;">0</p>
            </div>
            <div style="background: rgba(92, 108, 250, 0.1); border: 1px solid #5c6cfa; padding: 15px; border-radius: 10px; flex: 1;">
                <h4 style="margin: 0; color: #5c6cfa;">Waga danych (Eco)</h4>
                <p id="licznik-bajtow" style="font-size: 2em; font-weight: bold; margin: 5px 0;">0 B</p>
            </div>
        </div>

        <div style="background: rgba(0,0,0,0.3); padding: 25px; border-radius: 15px; text-align: left; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05);">
            <h3 style="color: #fff; margin-top: 0;">🎙️ Moduł Głosowy i Tekstowy</h3>
            <textarea id="pole-tekstowe" class="input-field" rows="4" placeholder="Wpisz tekst lub dyktuj..."></textarea>
            
            <div style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;">
                <button class="btn-neon" onclick="startDictation()" style="background: transparent; border: 2px solid #ff4757; color: #ff4757; padding: 10px 20px;">🔴 Nagrywaj</button>
                <button class="btn-neon" onclick="zmienTekst('upper')" style="padding: 10px 20px;">KAPITALKI</button>
                <button class="btn-neon" onclick="zmienTekst('lower')" style="padding: 10px 20px;">małe litery</button>
                <button class="btn-neon" onclick="zmienTekst('capitalize')" style="padding: 10px 20px;">Od Dużej</button>
                <button class="btn-neon" onclick="wyczyscTekst()" style="padding: 10px 20px; background: #333;">Wyczyść</button>
            </div>
        </div>

        <div style="background: rgba(0,0,0,0.3); padding: 25px; border-radius: 15px; text-align: left; border: 1px solid rgba(255,255,255,0.05);">
            <h3 style="color: #fff; margin-top: 0;">🎨 Generator Gradientów</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px;">
                <div><label style="color: #94a3b8; font-size: 13px; font-weight: bold;">Od:</label><input type="color" id="kolor-start" value="#5c6cfa" style="width: 100%; height: 40px; border: none; background: transparent;"></div>
                <div><label style="color: #94a3b8; font-size: 13px; font-weight: bold;">Do:</label><input type="color" id="kolor-end" value="#00ffcc" style="width: 100%; height: 40px; border: none; background: transparent;"></div>
            </div>
            <div id="gradient-preview" style="background: #111; padding: 15px; border-radius: 10px; font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 15px;">Tekst</div>
            <textarea id="kod-wynikowy" class="input-field" rows="3" readonly style="font-family: monospace; color: #00ffcc; background: #1a1a1a;"></textarea>
        </div>
    </div>

    <script>
        const poleTekstowe = document.getElementById('pole-tekstowe');
        
        function aktualizujStatystyki() {
            let txt = poleTekstowe.value;
            document.getElementById('licznik-znakow').innerText = txt.length;
            // Proste przeliczenie - przyjmujemy średnio 1 znak = 1 bajt (w UTF-8 bywa więcej, ale na potrzebe hackathonu jest git)
            let bytes = new Blob([txt]).size;
            document.getElementById('licznik-bajtow').innerText = bytes < 1024 ? bytes + " B" : (bytes/1024).toFixed(2) + " KB";
            generujGradient();
        }

        function zmienTekst(akcja) {
            let text = poleTekstowe.value;
            if (akcja === 'upper') poleTekstowe.value = text.toUpperCase();
            if (akcja === 'lower') poleTekstowe.value = text.toLowerCase();
            if (akcja === 'capitalize') poleTekstowe.value = text.replace(/\b\w/g, c => c.toUpperCase());
            aktualizujStatystyki();
        }
        function wyczyscTekst() { poleTekstowe.value = ''; aktualizujStatystyki(); }

        function startDictation() {
            if (window.hasOwnProperty('webkitSpeechRecognition')) {
                var recognition = new webkitSpeechRecognition();
                recognition.lang = "pl-PL";
                recognition.start();
                recognition.onresult = function(e) { poleTekstowe.value += (poleTekstowe.value ? ' ' : '') + e.results[0][0].transcript; aktualizujStatystyki(); };
            } else alert("Brak wsparcia dla dyktowania.");
        }

        const kolorStart = document.getElementById('kolor-start'), kolorEnd = document.getElementById('kolor-end'), podglad = document.getElementById('gradient-preview'), kodWynikowy = document.getElementById('kod-wynikowy');
        function hexToRgb(hex) { return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)]; }
        function rgbToHex(r,g,b) { return "#" + (1<<24 | r<<16 | g<<8 | b).toString(16).slice(1).toUpperCase(); }

        function generujGradient() {
            let text = poleTekstowe.value.trim() || "Tekst";
            let c1 = hexToRgb(kolorStart.value), c2 = hexToRgb(kolorEnd.value);
            let pHTML = "", gCode = "";

            for (let i = 0; i < text.length; i++) {
                let ratio = text.length > 1 ? i / (text.length - 1) : 0;
                let r = Math.round(c1[0] + (c2[0] - c1[0]) * ratio), g = Math.round(c1[1] + (c2[1] - c1[1]) * ratio), b = Math.round(c1[2] + (c2[2] - c1[2]) * ratio);
                let hex = rgbToHex(r, g, b), char = text[i];
                if (char === " ") { pHTML += " "; gCode += " "; } 
                else { pHTML += `<span style="color:${hex}">${char}</span>`; gCode += `&#${hex.replace('#','x')}${char}`; }
            }
            podglad.innerHTML = pHTML; kodWynikowy.value = text === "Tekst" ? "" : gCode;
        }
        ['input'].forEach(evt => { poleTekstowe.addEventListener(evt, aktualizujStatystyki); kolorStart.addEventListener(evt, generujGradient); kolorEnd.addEventListener(evt, generujGradient); });
        aktualizujStatystyki();
    </script>
{% endblock %}
